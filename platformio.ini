[platformio]
default_envs = esp32s3

[env]
lib_deps = bblanchon/ArduinoJson@6.21.5
build_flags = -std=gnu++17
build_unflags = -std=gnu++11

[env:esp32s3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = opi_opi
board_build.flash_mode = opi
board_build.f_flash = 80000000L
board_upload.flash_size = 32MB
board_upload.maximum_size = 4194304
board_build.partitions = partitions.csv
monitor_speed = 115200
lib_deps =
    ${env.lib_deps}
    https://github.com/mrcodetastic/ESP32-HUB75-MatrixPanel-DMA.git#3.0.14
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DNO_GFX

[env:diagnostic]
extends = env:esp32s3
build_flags = ${env:esp32s3.build_flags} -DAPP_MODE=1

[env:fixture]
extends = env:esp32s3
build_flags = ${env:esp32s3.build_flags} -DAPP_MODE=2

[env:hub75-diagnostic]
extends = env:diagnostic
build_flags = ${env:diagnostic.build_flags} -DENABLE_PANEL_OUTPUT=1

[env:hub75-fixture]
extends = env:fixture
build_flags = ${env:fixture.build_flags} -DENABLE_PANEL_OUTPUT=1

[env:native]
platform = native@1.2.1
test_build_src = no
build_flags = ${env.build_flags} -Wall -Wextra -Werror -pedantic
